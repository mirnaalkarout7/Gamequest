<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study with Ms. Mirna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@700&family=Pacifico&display=swap">
<style>
:root{--bg:#eaf0f8;--card:#fff;--ink:#18233a;--soft:#5b6780;--line:#c9d4e6;--blue:#2b59c3;--bluebg:#e3ebfb;--teal:#0f8b8d;--tealbg:#dcf2f2;--plum:#8a4fbf;
  --disp:"Fredoka","Trebuchet MS",sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--ink);background:var(--bg);display:grid;grid-template-columns:270px 1fr;grid-template-rows:100%}
aside{background:var(--card);border-right:2px solid var(--line);padding:18px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.05;padding:4px 8px 12px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Caveat',cursive;font-size:30px;line-height:.95}.brand .nm{color:var(--teal);font-family:'Pacifico',cursive;font-weight:400;font-size:25px;line-height:1.3}.bico{flex:none;width:60px}.bico svg{width:100%;height:auto;display:block}
h2{font-family:var(--disp);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:14px 8px 4px}
nav a{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink);font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid transparent}
nav a small{display:block;font-weight:400;color:var(--soft);font-size:13px}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--bluebg);border-color:var(--blue)}
nav a:focus-visible,button:focus-visible{outline:3px solid #e8962a;outline-offset:2px}
.ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:var(--tealbg)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--card);border-bottom:2px solid var(--line)}
.bar b{font-family:var(--disp);font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar a,.bar button{font:inherit;font-family:var(--disp);font-weight:600;font-size:14px;color:var(--blue);background:var(--bluebg);border:none;border-radius:10px;padding:7px 12px;text-decoration:none;cursor:pointer}
#menu{display:none}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
.home{flex:1;overflow:auto;padding:28px 22px}
.home h1{font-family:var(--disp);font-size:clamp(34px,6vw,54px);margin:0 0 8px}
.home h1{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(40px,6vw,64px);line-height:1.1}
.home h1 span{color:var(--teal);font-family:'Pacifico',cursive;font-weight:400;font-size:.82em;display:inline-block;transform:rotate(-3deg);padding:0 .1em}
.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:8px}.hero>div:last-child{flex:1;min-width:260px}.hero .pic{flex:none;width:clamp(120px,22vw,190px)}.hero .pic svg{width:100%;height:auto;display:block}
.home p{color:var(--soft);max-width:56ch;margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cards a{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 5px 0 #c3cfe3}
.cards a:hover{border-color:var(--blue);transform:translateY(-2px)}
.cards b{font-family:var(--disp);font-size:20px}
.cards small{color:var(--soft)}
.tag{justify-self:start;font-family:var(--disp);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:8px;padding:2px 8px;background:var(--tealbg);color:var(--teal)}
.tag.q{background:#efe5f8;color:var(--plum)}
@media (max-width:760px){
  body{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:5;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.2)}
  body.open aside{transform:none}
  #menu{display:inline-block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><span class="bico"><svg viewBox="0 0 240 220" role="img" aria-label="Chemistry illustration: a flask, a test tube and a molecule">
<defs>
<linearGradient id="lq1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58d0c9"/><stop offset="1" stop-color="#1f9c9e"/></linearGradient>
<linearGradient id="lq2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3a9b8"/><stop offset="1" stop-color="#e2708a"/></linearGradient>
</defs>
<ellipse cx="120" cy="206" rx="96" ry="8" fill="#c9d4e6"/>
<g stroke="#3b3550" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<!-- atom orbit behind -->
<g fill="none" stroke="#8a4fbf" stroke-width="2.500">
<ellipse cx="182" cy="62" rx="40" ry="14"/><ellipse cx="182" cy="62" rx="40" ry="14" transform="rotate(60 182 62)"/><ellipse cx="182" cy="62" rx="40" ry="14" transform="rotate(120 182 62)"/>
</g>
<circle cx="182" cy="62" r="8" fill="#e8962a"/>
<circle cx="222" cy="62" r="4" fill="#8a4fbf" stroke="none"/><circle cx="162" cy="27.500" r="4" fill="#8a4fbf" stroke="none"/><circle cx="162" cy="96.500" r="4" fill="#8a4fbf" stroke="none"/>
<!-- big flask -->
<path d="M78 40 H122 M86 40 V86 L44 172 Q34 198 60 198 H140 Q166 198 156 172 L114 86 V40" fill="#f4fbff"/>
<path d="M62 146 L50.500 171 Q43 191 62 191 H138 Q157 191 149.500 171 L138 146 Q100 132 62 146 Z" fill="url(#lq1)" stroke="none"/>
<circle cx="78" cy="170" r="6" fill="#fff" opacity=".85" stroke="none"/><circle cx="104" cy="158" r="4" fill="#fff" opacity=".85" stroke="none"/><circle cx="124" cy="176" r="3.500" fill="#fff" opacity=".85" stroke="none"/>
<path d="M94 52 V84" stroke="#fff" stroke-width="4" opacity=".9"/>
<circle cx="100" cy="24" r="7" fill="none" stroke="#1f9c9e"/><circle cx="120" cy="10" r="4.500" fill="none" stroke="#e2708a"/><circle cx="84" cy="8" r="3.500" fill="#e8962a" stroke="none"/>
<!-- test tube -->
<g transform="rotate(14 190 150)">
<path d="M176 104 H206 M180 104 V184 Q180 198 191 198 Q202 198 202 184 V104" fill="#f4fbff"/>
<path d="M183 150 V184 Q183 195 191 195 Q199 195 199 184 V150 Z" fill="url(#lq2)" stroke="none"/>
<circle cx="191" cy="164" r="2.800" fill="#fff" opacity=".85" stroke="none"/><circle cx="194" cy="178" r="2" fill="#fff" opacity=".85" stroke="none"/>
</g>
<!-- small molecule -->
<path d="M26 108 L46 92 L66 108" fill="none"/>
<circle cx="46" cy="92" r="11" fill="#e2708a"/><circle cx="26" cy="108" r="7.500" fill="#fff"/><circle cx="66" cy="108" r="7.500" fill="#fff"/>
</g>
</svg></span><span>Study with<br><span class="nm">Ms. Mirna</span></span></div>
  <nav id="nav" aria-label="Activities"></nav>
</aside>
<main>
  <div class="bar"><button id="menu" aria-label="Open menu">☰ Menu</button><b id="title">Home</b><a id="full" href="#" target="_blank" rel="noopener" hidden>Open full screen ↗</a></div>
  <div id="view" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</main>
<script>
// ====== ADD NEW ACTIVITIES HERE ======
// group: 'Simulations' or 'Game Quests' · file: the file name you uploaded
const ITEMS=[
  {group:'Game Quests', title:'Hydrocarbon Quest',      note:'Chapter 21 · 30 questions', file:'hydrocarbon-quest.html',      icon:'🧪'},
  {group:'Game Quests', title:'Functional Group Quest', note:'Chapter 22 · 30 questions', file:'functional-group-quest.html', icon:'🧬'},
];
// =====================================
const CHEM=document.querySelector('.bico').innerHTML;
const nav=document.getElementById('nav'), view=document.getElementById('view'), title=document.getElementById('title'), full=document.getElementById('full');
const slug=f=>f.replace(/\.html$/,'');
function drawNav(cur){
  const groups=[...new Set(ITEMS.map(i=>i.group))];
  nav.innerHTML=`<a href="#" class="${cur?'':'on'}"><span class="ico">🏠</span><span>Home</span></a>`+
    groups.map(g=>`<h2>${g}</h2>`+ITEMS.filter(i=>i.group===g).map(i=>`<a href="#${slug(i.file)}" class="${cur===i?'on':''}"><span class="ico">${i.icon}</span><span>${i.title}<small>${i.note}</small></span></a>`).join('')).join('');
}
function route(){
  const h=location.hash.slice(1); const it=ITEMS.find(i=>slug(i.file)===h);
  document.body.classList.remove('open'); drawNav(it);
  if(it){ title.textContent=it.title; full.hidden=false; full.href=it.file;
    view.innerHTML=`<iframe src="${it.file}" title="${it.title}" allow="fullscreen"></iframe>`; }
  else{ title.textContent='Home'; full.hidden=true;
    view.innerHTML=`<div class="home"><div class="hero"><div class="pic">${CHEM}</div><div><h1>Study with <span>Ms. Mirna</span></h1><p>SAAT-style chemistry game quests. Pick a quest to start.</p></div></div>
      <div class="cards">${ITEMS.map(i=>`<a href="#${slug(i.file)}"><span class="tag ${i.group==='Game Quests'?'q':''}">${i.group}</span><b>${i.icon} ${i.title}</b><small>${i.note}</small></a>`).join('')}</div></div>`; }
}
addEventListener('hashchange',route);
document.getElementById('menu').onclick=()=>document.body.classList.toggle('open');
view.addEventListener('click',()=>document.body.classList.remove('open'));
route();
</script>
</body>
</html>
